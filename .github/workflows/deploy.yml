name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the sitemap's lastmod dates come from real commits.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://rzl.si' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Turn on by setting the repository variable PAGES_ENABLED=true once Pages is enabled.
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    # Tell Bing, Yandex and other IndexNow engines the pages changed.
    needs: deploy
    runs-on: ubuntu-26.04
    steps:
      - name: Submit sitemap URLs
        env:
          SITE: ${{ vars.SITE_URL || 'https://rzl.si' }}
          KEY: 661340fa9241b7376a076c8c1a07a086
        run: |
          host=$(echo "$SITE" | sed -E 's#https?://##; s#/.*##')
          urls=$(curl -fsS "$SITE/sitemap-0.xml" | grep -o '<loc>[^<]*</loc>' | sed -E 's#</?loc>##g' | jq -R . | jq -sc .)
          body=$(jq -nc --arg host "$host" --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --argjson urls "$urls" '{host:$host,key:$key,keyLocation:$loc,urlList:$urls}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow responded $code"
          case "$code" in 200|202) ;; *) echo "::warning::IndexNow returned $code" ;; esac
